# Generated by dataimago::create_package_site(). Re-running with overwrite_config = FALSE keeps edits.
project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "overview/*.qmd"
    - "documentation/*.qmd"
    - "reference/*.qmd"
    - "articles/**/*.qmd"
  resources:
    - assets/fonts/**

execute:
  freeze: auto

website:
  title: "toOrdinal"
  description: "Cardinal to Ordinal Number & Date Conversion"
  site-url: "https://centerforassessment.github.io/toOrdinal/"
  repo-url: "https://github.com/centerforassessment/toOrdinal"
  favicon: assets/brand/favicon.png
  open-graph: true
  page-navigation: false
  search:
    location: navbar
    type: overlay
  navbar:
    title: "toOrdinal"
    logo: assets/brand/logo.svg
    logo-alt: "toOrdinal hex logo"
    pinned: false
    left:
      - href: overview/index.qmd
        text: Overview
      - text: Documentation
        menu:
          - href: articles/toOrdinal.qmd
            text: "Get started"
          - href: articles/index.qmd
            text: "Articles"
          - href: citation.qmd
            text: "Cite"
      - href: reference/index.qmd
        text: API
      - href: news.qmd
        text: "What's new"
    right:
      - icon: github
        href: https://github.com/centerforassessment/toOrdinal
        aria-label: "toOrdinal on GitHub"
  page-footer:
    left: "© 2026 Damian W. Betebenner"

format:
  pkgsite-html:
    css:
      - assets/fonts/latin/fonts.css
      - assets/fonts/latin-ext/fonts.css
      - assets/fonts/josefin/fonts.css
      - assets/fonts/math/fonts.css
      - assets/fonts/lang.css
    toc: true
    toc-depth: 3
    page-layout: article
    lang: en
