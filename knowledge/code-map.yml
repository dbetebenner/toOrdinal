# Gaps between the code and what the documentation says. Facts for the outline, not fixes.
gaps:
  - { what: "NEWS.md stops at 1.3-0.0; no entries for 1.3-1.0, 1.3-9.0 (Turkish), 1.3-9.1 or CRAN 1.4-0.0", at: "NEWS.md:1" }
  - { what: "CRAN carries 1.4-0.0 (2026-02-06); no commit on this branch or upstream master has that version. The 1.4-0.0 source as published on CRAN differs from source_sha only in DESCRIPTION Version/Date, man/toOrdinal-package.Rd:14-15 and the date at R/zzz.R:35", at: "DESCRIPTION:2" }
  - { what: "the vignette and README list five or six languages; the code supports eight (DUTCH, ENGLISH, FRENCH, GERMAN, GERMAN_ALT, SPANISH, SWEDISH, TURKISH)", at: "vignettes/toOrdinal.Rmd:63" }
  - { what: "man/toOrdinal.Rd says 'Additional options planned include ordinal_word'; Turkish implements it", at: "man/toOrdinal.Rd:19" }
  - { what: "man/toOrdinal.Rd says 'Postive integer'; the code accepts 0", at: "man/toOrdinal.Rd:14" }
  - { what: "man/toOrdinalDate.Rd and the vignette say date = NULL gives today's date; sapply over NULL returns list(), so the Sys.time() branch is never reached through the export", at: "man/toOrdinalDate.Rd:13" }
  - { what: "README shows Spanish 5 -> '5.º'; the code returns '5..º'", at: "README.md:57" }

# Behaviour probes: Rscript --vanilla, sourcing R/toOrdinal.R, R/toOrdinalDate.R and
# R/toOrdinal_Utility_Functions.R at source_sha (no install, so .onAttach did not run).
# Inputs and outputs copied from the console. Which of these are bugs and which are
# stated assumptions is the maintainer's call; the outline asks it.
observations:
  - { input: 'toOrdinal(c(1, 2, 3, 11, 21), "Spanish")', output: '"1.er" "2..º" "3.er" "11.er" "21.er"', at: "R/toOrdinal_Utility_Functions.R:44" }
  - { input: 'toOrdinal(2, "Turkish", "ordinal_word")', output: '"ikiinci"', note: "vowel-final words keep the suffix's first vowel (also altııncı, yirmiinci, elliinci)", at: "R/toOrdinal_Utility_Functions.R:87" }
  - { input: 'toOrdinal(11, "Turkish", "ordinal_word")', output: "error: infinite recursion", note: "any n whose remainder below 100 is not in the table (11-19, 21-29, ..., 999) recurses with hundreds = '0'", at: "R/toOrdinal_Utility_Functions.R:159" }
  - { input: 'toOrdinal(0, "Turkish", "ordinal_word")', output: "error: argument is of length zero", at: "R/toOrdinal_Utility_Functions.R:174" }
  - { input: 'toOrdinal(1, "English", "foo")', output: "list(NULL)", note: "an unknown convert_to returns NULL silently", at: "R/toOrdinal_Utility_Functions.R:92" }
  - { input: 'toOrdinal("3")', output: "error: non-numeric argument to mathematical function", at: "R/toOrdinal_Utility_Functions.R:8" }
  - { input: "toOrdinal(NA)", output: "error: missing value where TRUE/FALSE needed", at: "R/toOrdinal_Utility_Functions.R:8" }
  - { input: "toOrdinal(1e6)", output: '"1e+06th"', note: "as.character() of a large double", at: "R/toOrdinal_Utility_Functions.R:33" }
  - { input: "toOrdinalDate()", output: "list()", at: "R/toOrdinalDate.R:6" }
  - { input: 'toOrdinalDate("2017-10-09", "German")', output: "list(NULL)", at: "R/toOrdinal_Utility_Functions.R:107" }
  - { input: 'toOrdinalDate(as.Date("2017-10-09"))', output: '"October 9th, 2017"', at: "R/toOrdinal_Utility_Functions.R:104" }
