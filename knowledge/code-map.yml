# toOrdinal code map: an inventory derived from the code, not prose.
#
# Every `at:` is path:line at source_sha. Its permalink is
#   <source_url with /tree/ replaced by /blob/>/<path>#L<line>
# The Overview outline (knowledge/outline.yml) cites this file by key.
# Nothing here is approved Overview text; it is the evidence the pages would be composed from.
#
# Built by hand in a Claude Code session (claude-opus-5-5) on 2026-11-26. Phase D's pipeline
# does not exist yet (wi-20261101-package-site-knowledge-pipeline). Its first job can be to
# regenerate this file and diff it against this one.
#
# Scope: the package (R/, man/, tests/, vignettes/, DESCRIPTION, NAMESPACE, NEWS.md, inst/).
# Out of scope: ui/ (the generated site), .github/ (CI), LICENSE.md.

schema: codemap-proposal-0   # no schema is specified yet; this shape is a proposal
package: toOrdinal
source_repo: https://github.com/DBetebenner/toOrdinal
source_sha: 70fbc7c68121e072890bc05e5a5659e729be6ded
source_url: https://github.com/DBetebenner/toOrdinal/tree/70fbc7c68121e072890bc05e5a5659e729be6ded
source_branch: master
upstream: https://github.com/CenterForAssessment/toOrdinal   # same package code at this sha; the fork adds only the site and CI
built_on: 2026-11-26

description:
  title: { value: "Cardinal to Ordinal Number & Date Conversion", at: "DESCRIPTION:4" }
  description: { value: "Language specific cardinal to ordinal number conversion.", at: "DESCRIPTION:5" }
  version: { value: "1.3-9.1", at: "DESCRIPTION:2" }
  date: { value: "2024-12-3", at: "DESCRIPTION:3", note: "not zero-padded ISO" }
  authors:
    - { name: "Damian W. Betebenner", roles: [aut, cre], at: "DESCRIPTION:6" }
    - { name: "Andrew Martin", roles: [ctb], at: "DESCRIPTION:7" }
    - { name: "Jeff Erickson", roles: [ctb], at: "DESCRIPTION:8" }
  depends: { value: "R (>= 3.3)", at: "DESCRIPTION:10" }
  imports: { value: [crayon, pkgsearch], at: "DESCRIPTION:12" }
  suggests: { value: [knitr, rmarkdown, testthat], at: "DESCRIPTION:11" }
  license: { value: "GPL-3", at: "DESCRIPTION:18" }
  urls:
    value:
      - https://centerforassessment.github.io/toOrdinal/
      - https://github.com/centerforassessment/toOrdinal/
      - https://cran.r-project.org/package=toOrdinal
    at: "DESCRIPTION:13"

namespace:
  exports:
    - { name: toOrdinal, at: "NAMESPACE:1" }
    - { name: toOrdinalDate, at: "NAMESPACE:2" }
  imports_from:
    - { package: crayon, symbols: [bold, cyan, green, magenta, red, yellow], at: "NAMESPACE:3" }
    - { package: utils, symbols: [packageVersion, tail], at: "NAMESPACE:4" }
  called_with_double_colon:
    - { call: "pkgsearch::cran_package", at: "R/zzz.R:28" }
    - { call: "utils::packageDescription", at: "R/zzz.R:26" }

exports:
  - name: toOrdinal
    at: "R/toOrdinal.R:1"
    args:
      - { name: cardinal_number, default: null, at: "R/toOrdinal.R:3" }
      - { name: language, default: "English", at: "R/toOrdinal.R:4" }
      - { name: convert_to, default: "ordinal_number", at: "R/toOrdinal.R:5" }
    body: "sapply(cardinal_number, toOrdinal_INTERNAL, language, convert_to, USE.NAMES=FALSE)"
    body_at: "R/toOrdinal.R:7"
    vectorised_over: cardinal_number
    docs: "man/toOrdinal.Rd"
  - name: toOrdinalDate
    at: "R/toOrdinalDate.R:1"
    args:
      - { name: date, default: NULL, at: "R/toOrdinalDate.R:3" }
      - { name: language, default: "English", at: "R/toOrdinalDate.R:4" }
    body: "sapply(date, toOrdinalDate_INTERNAL, language, USE.NAMES=FALSE)"
    body_at: "R/toOrdinalDate.R:6"
    vectorised_over: date
    docs: "man/toOrdinalDate.Rd"

internals:
  - name: toOrdinal_INTERNAL
    at: "R/toOrdinal_Utility_Functions.R:2"
    role: "validates one number, then dispatches on toupper(language) and convert_to"
    validation:
      - { rule: "must be a non-negative whole number, else stop()", at: "R/toOrdinal_Utility_Functions.R:8" }
      - { rule: "language must be in supported_languages, else stop()", at: "R/toOrdinal_Utility_Functions.R:13" }
    supported_languages: { at: "R/toOrdinal_Utility_Functions.R:12" }
    convert_to_matching: "gsub('_', ' ', toupper(convert_to)); so 'ordinal_number', 'Ordinal Number' and 'ORDINAL_NUMBER' all match"
    convert_to_at: ["R/toOrdinal_Utility_Functions.R:19", "R/toOrdinal_Utility_Functions.R:60"]
    ordinal_number_switch: { from: "R/toOrdinal_Utility_Functions.R:22", to: "R/toOrdinal_Utility_Functions.R:55" }
    ordinal_word_switch: { from: "R/toOrdinal_Utility_Functions.R:63", to: "R/toOrdinal_Utility_Functions.R:90" }
  - name: toOrdinalDate_INTERNAL
    at: "R/toOrdinal_Utility_Functions.R:95"
    role: "English only: '<Month> <toOrdinal(day)>, <Year>'; no branch for other languages"
    english_branch: "R/toOrdinal_Utility_Functions.R:102"
    calls: [toOrdinal]
    null_date_branch: { uses: "Sys.time()", at: "R/toOrdinal_Utility_Functions.R:103" }
  - name: strTail
    at: "R/toOrdinal_Utility_Functions.R:112"
    role: "last n characters of each string; used by the English, Spanish and Swedish rules"
  - name: get_turkish_number_word
    at: "R/toOrdinal_Utility_Functions.R:140"
    role: "Turkish cardinal word for 1 to 999, by lookup (1-10, tens, hundreds) and recursion on the remainder"
    lookup_table: { from: "R/toOrdinal_Utility_Functions.R:141", to: "R/toOrdinal_Utility_Functions.R:149" }
    limit: { rule: "stop() above 999", at: "R/toOrdinal_Utility_Functions.R:162" }
  - name: turkish_ordinal_suffix
    at: "R/toOrdinal_Utility_Functions.R:167"
    role: "picks -ıncı / -uncu / -inci / -üncü from the word's last vowel (vowel harmony)"
    vowels: "R/toOrdinal_Utility_Functions.R:171"
  - name: .onAttach
    at: "R/zzz.R:5"
    role: "interactive sessions only: prints installed, CRAN and GitHub versions"
    network:
      - { what: "CRAN version via pkgsearch::cran_package()", at: "R/zzz.R:28" }
      - { what: "dev version from raw.githubusercontent.com/CenterForAssessment/<pkg>/refs/heads/master/DESCRIPTION", at: "R/zzz.R:9" }
    hard_coded_date: { value: "2024-12-4", at: "R/zzz.R:35" }
  - name: .onLoad
    at: "R/zzz.R:1"
    role: "empty"

data_objects: []   # no data/ directory and no exported data sets

languages:
  # rule = what the code does, quoted from the switch arms; tests = which test file covers it
  - name: DUTCH
    ordinal_number: { rule: "n %% 100 in 11..19 -> 'de'; else last digit 1, 8 or 0 -> 'ste'; else 'de'", at: "R/toOrdinal_Utility_Functions.R:23" }
    ordinal_word: { implemented: false, at: "R/toOrdinal_Utility_Functions.R:64" }
    tests: { file: "tests/testthat/test_toOrdinal_dutch.R", covers: "0-30, negative input" }
    added: { version: "1.2-0.0", by: "huisman", at: "NEWS.md:8" }
  - name: ENGLISH
    ordinal_number: { rule: "last two digits 11, 12, 13 -> 'th'; else last digit 1 'st', 2 'nd', 3 'rd', otherwise 'th'", at: "R/toOrdinal_Utility_Functions.R:32" }
    ordinal_word: { implemented: false, at: "R/toOrdinal_Utility_Functions.R:67" }
    tests: { file: "tests/testthat/test_toOrdinal_english.R", covers: "0-40, negative input" }
    added: { version: "0.0-1", at: "NEWS.md:50" }
  - name: FRENCH
    ordinal_number: { rule: "1 -> 're'; else 'e'", at: "R/toOrdinal_Utility_Functions.R:39" }
    ordinal_word: { implemented: false, at: "R/toOrdinal_Utility_Functions.R:70" }
    tests: none
    added: { version: "0.0-1", note: "present in the first package-source commit 2a2ef72" }
  - name: GERMAN
    ordinal_number: { rule: "n <= 19 -> 'te'; else 'ste'", at: "R/toOrdinal_Utility_Functions.R:40" }
    ordinal_word: { implemented: false, at: "R/toOrdinal_Utility_Functions.R:73" }
    tests: { file: "tests/testthat/test_toOrdinal_german.R", covers: "0-20, negative input" }
    added: { version: "0.0-1", note: "present in the first package-source commit 2a2ef72; '0te' added in 0.0-7", at: "NEWS.md:27" }
  - name: GERMAN_ALT
    ordinal_number: { rule: "always '.' (the full stop)", at: "R/toOrdinal_Utility_Functions.R:41" }
    ordinal_word: { implemented: false, at: "R/toOrdinal_Utility_Functions.R:76" }
    tests: none
    added: { version: "0.0-7", at: "NEWS.md:26" }
  - name: SPANISH
    ordinal_number: { rule: "last digit 1 or 3 -> '.er'; else '..º' (two dots, as written)", at: "R/toOrdinal_Utility_Functions.R:42" }
    ordinal_word: { implemented: false, at: "R/toOrdinal_Utility_Functions.R:79" }
    tests: none
    added: { version: "0.0-2", note: "first appears in commit bae47b1 (0.0-2)" }
  - name: SWEDISH
    ordinal_number: { rule: "last two digits 11 or 12, or last digit 0 or 3-9 -> ':e'; else ':a'", at: "R/toOrdinal_Utility_Functions.R:46" }
    ordinal_word: { implemented: false, at: "R/toOrdinal_Utility_Functions.R:82" }
    tests: { file: "tests/testthat/test_toOrdinal_swedish.R", covers: "0-40, 101, 102, 111, 112, negative input" }
    added: { version: "0.0-3", by: "Jeff Erickson", at: "NEWS.md:43" }
  - name: TURKISH
    ordinal_number: { rule: "always '.'", at: "R/toOrdinal_Utility_Functions.R:51" }
    ordinal_word: { implemented: true, rule: "get_turkish_number_word(n) + turkish_ordinal_suffix(word); 1-999", at: "R/toOrdinal_Utility_Functions.R:85" }
    tests: none
    added: { version: "1.3-9.0", note: "commit 692e2d1 'Updating logic and adding Turkish' added TURKISH to supported_languages and the ordinal_word path; a TURKISH branch existed earlier but was not in the supported list", at: "R/toOrdinal_Utility_Functions.R:12" }

date_languages:   # toOrdinalDate
  value: [ENGLISH]
  at: "R/toOrdinal_Utility_Functions.R:102"

tests:
  runner: { file: "tests/testthat.R", framework: testthat, edition: "2 (context() calls)" }
  files:
    - { file: "tests/testthat/test_toOrdinal_dutch.R", tests: 2 }
    - { file: "tests/testthat/test_toOrdinal_english.R", tests: 2 }
    - { file: "tests/testthat/test_toOrdinal_german.R", tests: 2 }
    - { file: "tests/testthat/test_toOrdinal_swedish.R", tests: 3 }
    - { file: "tests/testthat/test_toOrdinalDate_english.R", tests: 1 }
  untested: [FRENCH, GERMAN_ALT, SPANISH, TURKISH, "convert_to = 'ordinal_word'", "toOrdinalDate(NULL)", "non-English toOrdinalDate"]

